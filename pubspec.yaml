name: trail_capsule
description: 离线旅行资料与行程口袋，支持 Android 和 iOS。
publish_to: none
version: 1.1.2+5
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: 14.8.1
  drift: 2.26.1
  sqlite3: 2.7.5
  sqlite3_flutter_libs: 0.5.32
  path_provider: 2.1.5
  file_picker: 10.1.9
  share_plus: 10.1.4
  archive: 4.0.7
  uuid: 4.5.1
  timezone: 0.10.1
  crypto: 3.0.6
  path: 1.9.1
  url_launcher: 6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
